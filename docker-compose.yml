# Déploiement de Bolli Rental sur un VPS.
#
# Les quatre conteneurs partagent la même image, construite par l'intégration
# continue et récupérée depuis GHCR : le serveur web sert donc exactement les
# assets compilés avec le code PHP qu'exécute l'application.
#
# Seul `web` publie un port, et uniquement sur la boucle locale : le proxy de
# 1Panel est le seul chemin d'entrée, c'est lui qui porte le domaine et TLS.

name: bolli-rental

x-app: &app
    image: ${APP_IMAGE:?APP_IMAGE est requis — la chaîne de déploiement l'écrit dans .env}
    restart: unless-stopped
    env_file:
        - .env
    # Sans plafond, les journaux d'un conteneur redémarrant en boucle saturent le
    # disque du VPS avant qu'on s'en aperçoive.
    logging:
        driver: json-file
        options:
            max-size: '10m'
            max-file: '3'

services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:?}
            POSTGRES_USER: ${DB_USERNAME:?}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?}
            # Le collationnement est figé à la création du volume : le laisser au hasard
            # de l'hôte ferait diverger les tris entre deux installations.
            POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 15s
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    # Migrations, jeu de démonstration et caches applicatifs : tout est joué ici au
    # démarrage, avant que PHP-FPM n'accepte la première requête.
    app:
        <<: *app
        environment:
            CONTAINER_ROLE: app
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'nc -z 127.0.0.1 9000 || exit 1']
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 768M

    web:
        <<: *app
        environment:
            CONTAINER_ROLE: web
        depends_on:
            app:
                condition: service_healthy
        ports:
            - '127.0.0.1:${APP_PORT:-8080}:8080'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q --spider http://127.0.0.1:8080/up || exit 1',
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        deploy:
            resources:
                limits:
                    memory: 128M

    # La file est en base et rien n'y est publié aujourd'hui. Le worker est présent
    # pour qu'un e-mail mis en file demain parte, au lieu d'attendre indéfiniment.
    queue:
        <<: *app
        environment:
            CONTAINER_ROLE: queue
        depends_on:
            app:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 256M

volumes:
    db-data:
