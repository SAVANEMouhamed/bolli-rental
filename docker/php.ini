; Réglages de production. Le fichier est chargé après php.ini-production et
; n'active que ce qui diffère de la configuration par défaut de l'image.

expose_php = Off
memory_limit = 256M
max_execution_time = 30
post_max_size = 12M
upload_max_filesize = 8M

; Aucune erreur affichée au client : elles partiraient dans une réponse HTTP.
; Elles sont écrites sur la sortie d'erreur, que Docker collecte.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; L'application tourne en UTC ; Abidjan est à UTC+0, la date SQL est donc bien la
; date locale d'un agent.
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Le code d'une image ne change jamais : inutile de vérifier l'horodatage des
; fichiers à chaque requête. Un déploiement remplace le conteneur, pas ses fichiers.
opcache.validate_timestamps = 0
opcache.enable_cli = 0
