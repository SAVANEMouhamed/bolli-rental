# Serveur web du conteneur « web ». Il tourne sans privilèges : d'où le port 8080
# et les chemins temporaires dans /var/lib/nginx, dont l'utilisateur est propriétaire.

pid /run/nginx/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  30;
    client_max_body_size 12M;

    # La version de nginx n'apprend rien à un visiteur légitime et beaucoup à un
    # scanner de vulnérabilités.
    server_tokens off;

    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    # Le proxy amont (1Panel) termine TLS. `HTTPS` ne doit valoir « on » que si
    # l'en-tête dit bien https : passer la valeur brute mettrait « http », que PHP
    # interprète comme une valeur non vide, donc comme du TLS.
    map $http_x_forwarded_proto $fastcgi_https {
        default '';
        https   on;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # En-têtes défensifs. Pas de CSP stricte ici : elle se règle au niveau du
        # proxy 1Panel, qui connaît le domaine final et les éventuels tiers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Les noms de fichiers produits par Vite portent une empreinte de contenu :
        # un changement produit un nouveau nom, le cache peut donc être définitif.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Seul le contrôleur frontal est exécutable. Sans cette restriction, tout
        # fichier .php déposé sous public/ deviendrait un point d'entrée.
        location ~ ^/index\.php(/|$) {
            # Résolution à la requête via le DNS interne de Docker, et non au
            # chargement de la configuration : nginx survit ainsi au redémarrage
            # du conteneur applicatif, qui change d'adresse IP.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $upstream_app app:9000;
            fastcgi_pass $upstream_app;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ \.php$ {
            return 404;
        }

        # Fichiers cachés : .env, .git et consorts n'ont rien à faire sous public/,
        # mais une erreur de déploiement ne doit pas les rendre lisibles.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
