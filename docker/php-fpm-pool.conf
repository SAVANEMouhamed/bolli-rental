; Pool de production. Le conteneur tourne déjà sous www-data : les directives
; user/group sont volontairement absentes, PHP-FPM refuserait de les appliquer
; sans privilèges root.

[www]
listen = 0.0.0.0:9000

; `dynamic` s'adapte à la charge d'un outil interne, dont le trafic est irrégulier.
; Ces valeurs tiennent dans 256 Mo de mémoire PHP par processus au pire cas.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Recycler les workers borne les fuites mémoire éventuelles d'une extension.
pm.max_requests = 500

; Les journaux d'accès et d'erreur partent sur la sortie du conteneur, collectée
; par Docker. Aucun fichier de log n'est écrit dans l'image.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on

; Une requête qui dépasse dix secondes est anormale : sa trace est journalisée.
request_slowlog_timeout = 10s
slowlog = /dev/stderr

clear_env = no
