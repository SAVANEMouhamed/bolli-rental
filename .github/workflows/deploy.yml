name: CI et déploiement

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  ci:
    name: Qualité et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # La suite Pest tourne sur SQLite ; sans cette base, le moteur de production
    # ne serait jamais vérifié — c'est là que vivent les contraintes CHECK.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bolli_ci
          POSTGRES_USER: bolli
          POSTGRES_PASSWORD: bolli
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bolli -d bolli_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bolli_ci
      DB_USERNAME: bolli
      DB_PASSWORD: bolli

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      # Les tests rendent la vue racine d'Inertia, qui appelle @vite : sans
      # manifeste, toute la suite échoue.
      - name: Compiler les assets
        run: npm run build

      - name: Migrations et seeders sur PostgreSQL
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction
          php artisan db:seed --force --no-interaction

      - name: Contrôles de qualité et tests
        run: composer ci:check

  deploy:
    name: Construire et livrer
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publier l'image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build \
            --tag "${repository}:latest" \
            --tag "${repository}:sha-${GITHUB_SHA::12}" \
            --cache-from "type=registry,ref=${repository}:buildcache" \
            --cache-to "type=registry,ref=${repository}:buildcache,mode=max" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --provenance=false \
            --push .

      # L'environnement du VPS est rendu ici à chaque livraison : le serveur ne
      # porte aucune configuration à maintenir à la main, et GitHub reste la seule
      # source des secrets.
      - name: Composer la configuration du serveur
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          APP_URL: ${{ vars.APP_URL }}
          APP_PORT: ${{ vars.APP_PORT }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_NETWORK: ${{ vars.DB_NETWORK || '1panel-network' }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          SEED_ON_DEPLOY: ${{ vars.SEED_ON_DEPLOY || 'true' }}
        run: |
          for required in APP_KEY DB_PASSWORD APP_URL APP_PORT DB_HOST DB_PORT DB_DATABASE DB_USERNAME; do
            if [ -z "${!required}" ]; then
              echo "::error::${required} est vide — renseigner le secret ou la variable du dépôt"
              exit 1
            fi
          done

          # Sans serveur SMTP configuré, les e-mails partent dans les journaux
          # plutôt que de faire échouer l'invitation d'un agent.
          mailer=log
          [ -n "$MAIL_HOST" ] && mailer=smtp

          # Les valeurs sont mises entre guillemets et échappées : un mot de passe
          # d'application Gmail contient des espaces, et dotenv s'arrêterait au
          # premier. Un `$` ou un `"` non échappés casseraient la lecture de la
          # même façon.
          for name in APP_KEY APP_URL DB_HOST DB_DATABASE DB_USERNAME DB_PASSWORD \
                      MAIL_HOST MAIL_USERNAME MAIL_PASSWORD MAIL_FROM_ADDRESS; do
            printf -v "$name" '"%s"' "$(printf '%s' "${!name}" | sed 's/[\\"$]/\\&/g')"
          done

          umask 077
          cat > .env <<CONFIG
          APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest
          APP_PORT=${APP_PORT}

          APP_NAME="Bolli Rental"
          APP_ENV=production
          APP_KEY=${APP_KEY}
          APP_DEBUG=false
          APP_URL=${APP_URL}
          APP_LOCALE=fr
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=fr_FR

          LOG_CHANNEL=stderr
          LOG_STACK=stderr
          LOG_LEVEL=warning

          DB_CONNECTION=pgsql
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          DB_NETWORK=${DB_NETWORK}

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_SECURE_COOKIE=true
          SESSION_SAME_SITE=lax

          QUEUE_CONNECTION=sync
          CACHE_STORE=database
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local

          TRUSTED_PROXIES=*

          MAIL_MAILER=${mailer}
          MAIL_SCHEME=smtp
          MAIL_HOST=${MAIL_HOST}
          MAIL_PORT=${MAIL_PORT}
          MAIL_USERNAME=${MAIL_USERNAME}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
          MAIL_FROM_NAME="\${APP_NAME}"

          SEED_ON_DEPLOY=${SEED_ON_DEPLOY}
          CONFIG

      - name: Livrer sur le VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/id_deploy -P "$PORT" -q \
            docker-compose.yml "$SSH_USER@$HOST:$TARGET/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -P "$PORT" -q \
            server-config "$SSH_USER@$HOST:$TARGET/.env"

          # Le jeton part sur l'entrée standard, consommée par `docker login` : il
          # n'apparaît pas dans la table des processus du VPS. `--wait` attend la
          # santé du conteneur, donc une migration en échec fait échouer la livraison.
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$SSH_USER@$HOST" "
            set -e
            cd '$TARGET'
            chmod 600 .env
            docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin
            docker compose pull --quiet
            docker compose up -d --wait --wait-timeout 240 --remove-orphans
            docker logout ghcr.io >/dev/null
            docker image prune --force --filter 'until=168h' >/dev/null
            docker compose ps
          " <<< "$TOKEN"
